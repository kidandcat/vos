name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: true
      - name: Kernel axioms
        run: bash scripts/check-axioms.sh
      - name: Host demo
        run: |
          source "$HOME/.elan/env"
          lake exe vos-demo
